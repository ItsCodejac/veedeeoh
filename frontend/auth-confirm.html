<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirming — veedeeoh.</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      WHERE A CONFIRMATION LINK LANDS.

      The first version pointed straight at GoTrue:

        https://<ref>.supabase.co/auth/v1/verify?token=…&apikey=eyJhbGciOi…

      Three things wrong with that. It is somebody else's domain in an email
      that claims to be from us, which is the single strongest signal a
      phishing filter looks for. It carries an apikey query parameter, which is
      the second. And it is unreadable, so the one instruction we give people
      who cannot use the button -- paste this into your browser -- asks them to
      paste eighty characters of base64 they have every reason to distrust.

      The key itself was never a secret. The anon key ships in the front-end
      bundle and authorises nothing on its own. The problem was never exposure,
      it was that the link looked like an attack.

      So the link is ours now, short and legible, and the exchange happens here
      with supabase-js instead. Same token, same verification, on a page that
      says veedeeoh at the top.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #06070a; color: #f3f4f6; padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%; max-width: 440px; text-align: center;
        background: #0d1017; border: 1px solid #1e2533; border-radius: 16px; padding: 38px 32px;
      }
      .mark { font-size: 27px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 26px; }
      .mark span { color: #c5f04e; }
      h1 { margin: 0 0 10px; font-size: 21px; font-weight: 800; }
      p { margin: 0; font-size: 14.5px; line-height: 1.6; color: #9aa3b2; }
      .btn {
        display: inline-block; margin-top: 22px; padding: 13px 26px; border-radius: 10px;
        background: #c5f04e; color: #06070a; font-weight: 800; font-size: 15px; text-decoration: none;
      }
      .spin {
        width: 26px; height: 26px; margin: 4px auto 18px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.15); border-top-color: #c5f04e;
        animation: s 0.8s linear infinite;
      }
      @keyframes s { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
      .hide { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">veedeeoh<span>.</span></div>

      <div id="working">
        <div class="spin" role="status" aria-label="Confirming"></div>
        <h1>Confirming your email</h1>
        <p>One moment.</p>
      </div>

      <div id="done" class="hide">
        <h1 id="doneTitle">You're all set</h1>
        <p id="doneBody">Taking you to veedeeoh.</p>
        <a class="btn" id="doneCta" href="/index.html">Start watching</a>
      </div>

      <div id="failed" class="hide">
        <h1 id="failTitle">That link has expired</h1>
        <p id="failBody">
          Confirmation links can only be used once, and they do not last long.
          Sign in and we will send you a fresh one.
        </p>
        <a class="btn" href="/landing.html">Back to sign in</a>
      </div>
    </div>

    <script type="module" src="/src/auth-confirm.ts"></script>
  </body>
</html>
