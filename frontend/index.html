<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>veedeeoh.</title>
  <meta name="theme-color" content="#07080b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="veedeeoh.">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Boot splash: covers the app chrome until the "Who's Watching" gate is ready. -->
  <div id="bootSplash" style="position:fixed;inset:0;z-index:100000;background:#06070a;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease;">
    <div style="font-family:'Bricolage Grotesque','Space Grotesk',sans-serif;font-size:44px;font-weight:800;color:#fff;letter-spacing:-1px;">veedeeoh<span style="color:#c5f04e;">.</span></div>
  </div>

  <!-- Sidebar Navigation Dock -->
  <aside>
    <a href="#" id="brand" class="brand">veedeeoh<span>.</span></a>
    <button id="tabHome" title="Home" class="navBtn active">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </button>
    <button id="tabShows" title="Shows" class="navBtn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
        <polyline points="17 2 12 7 7 2"></polyline>
      </svg>
      <span>Shows</span>
    </button>
    <button id="tabMovies" title="Movies" class="navBtn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
        <line x1="7" y1="2" x2="7" y2="22"></line>
        <line x1="17" y1="2" x2="17" y2="22"></line>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="2" y1="7" x2="7" y2="7"></line>
        <line x1="2" y1="17" x2="7" y2="17"></line>
        <line x1="17" y1="17" x2="22" y2="17"></line>
        <line x1="17" y1="7" x2="22" y2="7"></line>
      </svg>
      <span>Movies</span>
    </button>
    <button id="tabFavs" title="My List" class="navBtn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polygon
          points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
        </polygon>
      </svg>
      <span>My List</span>
    </button>
    <button id="tabParty" title="veedeeoh.party" class="navBtn" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c5f04e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span class="partyWordmark" style="white-space:nowrap;font-weight:800;">veedeeoh<span style="color:#c5f04e;">.</span><span style="color:#c5f04e;">party</span></span>
      <span class="navShort">Party</span>
    </button>
    <button id="tabKids" title="veedeeoh.kids" class="navBtn" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c5f04e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
        <line x1="9" y1="9" x2="9.01" y2="9"></line>
        <line x1="15" y1="9" x2="15.01" y2="9"></line>
      </svg>
      <span class="kidsWordmark" style="white-space:nowrap;font-weight:800;">veedeeoh<span style="color:#7ed957;">.</span><span style="color:#ff9f1c;">k</span><span style="color:#4dabf7;">i</span><span style="color:#ff6b6b;">d</span><span style="color:#a9e34b;">s</span></span>
      <span class="navShort">Kids</span>
    </button>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-user" id="sidebarUser">
      <div class="sidebar-avatar" id="sidebarAvatar">?</div>
      <span class="sidebar-email" id="sidebarEmail"></span>
      <span class="navShort">You</span>
    </div>
    <button id="logoutBtn" class="navBtn sidebar-logout" title="Sign Out">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span>Sign Out</span>
    </button>
    <!-- Reachable from inside the app, not only from the marketing page. Both
         are linked at signup, but somebody looking for what they agreed to
         will look here. -->
    <p class="sidebar-legal">
      <a href="/terms.html" target="_blank" rel="noopener">Terms</a>
      <span aria-hidden="true">&middot;</span>
      <a href="/privacy.html" target="_blank" rel="noopener">Privacy</a>
    </p>
  </aside>

  <!-- Main Area -->
  <main id="mainContent">
    <div id="ambientGlow"></div>

    <!-- Header bar -->
    <header>
      <a href="#" class="mobile-brand">v<span>.</span></a>
      <div id="searchContainer">
        <div id="searchBar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="search" type="search" placeholder="Search movies and shows..." autocomplete="off">
          <button id="searchCloseBtn" class="search-close-btn" title="Close search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div id="searchResultsOverlay" hidden>
          <!-- Search results dynamically populated here -->
        </div>
      </div>
      <div class="header-right-group">
        <button id="searchToggleBtn" class="search-toggle-btn" title="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <select id="regionSelector" class="region-selector-pill" title="Catalog region">
          <option value="US">US</option>
          <option value="GB">UK</option>
          <option value="CA">CA</option>
          <option value="DE">DE</option>
          <option value="ES">ES</option>
          <option value="MX">MX</option>
          <option value="FR">FR</option>
        </select>
      </div>
    </header>

    <!-- Scrollable main panel content -->
    <div id="scrollableArea">
      <!-- Panel 1: Home View -->
      <div id="homeView" class="viewPanel" hidden>
        <div id="homeHero"></div>
        <div id="homeRails"></div>
      </div>

      <!-- Panel 3: Shows View -->
      <div id="showsView" class="viewPanel" hidden>
        <div class="viewHeaderActions" style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px;">
          <input type="text" id="showsSearch" placeholder="Search shows..." class="searchBar"
            style="width: 100%; max-width: 400px; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--fg); font-family: inherit; font-size: 15px; outline: none;">
          <div id="showsGenreFilters" class="filterChips" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
        </div>
        <div id="showsHero"></div>
        <div id="showsRails"></div>
      </div>

      <!-- Panel 4: Movies View -->
      <div id="moviesView" class="viewPanel" hidden>
        <div class="viewHeaderActions" style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px;">
          <input type="text" id="moviesSearch" placeholder="Search movies..." class="searchBar"
            style="width: 100%; max-width: 400px; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--fg); font-family: inherit; font-size: 15px; outline: none;">
          <div id="moviesGenreFilters" class="filterChips" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
        </div>
        <div id="moviesHero"></div>
        <div id="moviesRails"></div>
      </div>

      <!-- Panel 6: Ocean TV View Panel -->
      <div id="oceanView" class="viewPanel" hidden>
        <div id="oceanRails"></div>
      </div>

      <!-- veedeeoh.party: join a party by code, and manage the one you host -->
      <div id="partyView" class="viewPanel" hidden>
        <div id="partyPanel"></div>
      </div>

      <!-- Panel 7: veedeeoh.kids (parent shortcut to a kid-safe browse) -->
      <div id="kidsView" class="viewPanel" hidden>
        <div id="kidsRails"></div>
      </div>

      <!-- Settings, as a routed page. Was a modal that opened other modals. -->
      <div id="settingsView" class="viewPanel" hidden>
        <div class="settingsWrap">
          <header class="settingsHead">
            <h1>Settings</h1>
          </header>
          <div class="settingsCols">
            <nav id="settingsNav" class="settingsNav"></nav>
            <div id="settingsBody" class="settingsBody"></div>
          </div>
        </div>
      </div>

      <!-- Full search results. The header dropdown is a preview of this. -->
      <div id="searchView" class="viewPanel" hidden>
        <div class="categoryHeaderBar">
          <button id="searchViewBackBtn" class="categoryBackBtn" style="display:inline-flex;align-items:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back</button>
          <div class="categoryHeaderTitleGroup">
            <h1>Results for <span id="searchViewQuery"></span></h1>
            <span id="searchViewCount" class="categoryCountBadge">0 titles</span>
          </div>
        </div>
        <div id="searchViewFilters" class="searchFilterBar"></div>
        <div id="searchViewGrid" class="categoryGridContainer"></div>
      </div>

      <!-- Dedicated Category View Panel (Netflix / Hulu Pattern) -->
      <div id="categoryView" class="viewPanel" hidden>
        <div class="categoryHeaderBar">
          <button id="categoryBackBtn" class="categoryBackBtn" style="display:inline-flex;align-items:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back</button>
          <div class="categoryHeaderTitleGroup">
            <h1 id="categoryTitleName">Category Name</h1>
            <span id="categoryItemCount" class="categoryCountBadge">0 titles</span>
          </div>
        </div>
        <div id="categoryGrid" class="categoryGridContainer"></div>
      </div>

    </div>
  </main>

  <!-- VOD Details overlay modal -->
  <div id="vodDetailsOverlay" hidden>
    <div id="vodDetailsAmbient"></div>
    <div id="vodDetails">
      <div id="vdHero">
        <div id="vdBanner"></div>
        <div id="vdHeroContent">
          <div id="vdPosterWrap">
            <span id="vdPoster"></span>
          </div>
          <div id="vdHeroMeta">
            <h1 id="vdTitle"></h1>
            <div id="vdMeta"></div>
            <div id="vdStars" style="display:inline-flex;gap:3px;align-items:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
            <div id="vdActions" style="display: flex; gap: 10px; flex-wrap: wrap;">
              <button id="vdPlayBtn" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>START WATCHING</button>
            </div>
            <p id="vdSummary"></p>
          </div>
          <button id="vdClose" title="Close show details"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
      </div>
      <div id="vodDetailsBody">
        <div id="vdSelectorContainer">
          <select id="vdSeasonSelect"></select>
        </div>
        <div id="vdEpisodeGrid"></div>
      </div>
    </div>
  </div>

  <!-- Cinematic VOD Player Overlay -->
  <div id="vodPlayerOverlay" hidden>
  </div>

  <!-- Party Mode Player Overlay -->
  <div id="partyPlayerOverlay" hidden>
    <div class="partyPlayerHeader">
      <button id="partyPlayerClose" style="display:inline-flex;align-items:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back to Browse</button>
    </div>

    <canvas id="partyVisualizer"></canvas>

    <div id="partyLayout">
      <div id="partyControls">
        <div class="partyHeader">
          <span class="partyBrand">veedeeoh<span>.</span> party</span>
          <p class="partySubtitle">continuous music video & visualizer stream</p>
        </div>

        <div class="moodSelector">
          <button class="moodChip active" data-mood="chillout" style="display:inline-flex;align-items:center;gap:7px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>Chillout</button>
          <button class="moodChip" data-mood="high-energy" style="display:inline-flex;align-items:center;gap:7px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>High Energy</button>
          <button class="moodChip" data-mood="retro" style="display:inline-flex;align-items:center;gap:7px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>Retro</button>
        </div>

        <div id="partyTrackInfo" class="partyTrackInfo">
          <h2 id="partyTrackTitle">No Track Playing</h2>
          <span id="partyTrackGenre">Select a mood to begin</span>
          <p id="partyTrackSummary"></p>
        </div>

        <div class="partyButtons">
          <button id="partyPlayBtn" class="actionBtn primary" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>PLAY</button>
          <button id="partyNextBtn" class="actionBtn" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>NEXT TRACK</button>
        </div>

        <div class="visualizerSelector">
          <span>Visualizer:</span>
          <button id="visStyleBars" class="visStyleBtn active">Bars</button>
          <button id="visStyleWave" class="visStyleBtn">Wave</button>
        </div>
      </div>

      <div id="partyVideoCol">
        <div id="partyVideoWrapper">
          <video id="partyVideoA" autoplay playsinline></video>
          <video id="partyVideoB" autoplay playsinline></video>
        </div>
        <div id="partyQueuePanel">
          <h3>Upcoming Tracklist</h3>
          <div id="partyQueueList"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
