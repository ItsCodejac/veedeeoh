name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Both products are built from this repo and CI used to build only one of
      # them, so a change that broke the other reached main green.

      - name: Build self-host
        env:
          VEEDEEOH_TARGET: selfhost
          VITE_SUPABASE_URL: https://selfhost-must-ignore.supabase.co
          VITE_SUPABASE_ANON_KEY: selfhost-must-ignore
        run: cd frontend && npm run build

      - name: Self-host build must contain no Supabase
        run: |
          cd frontend
          if grep -rlE "https://[a-z0-9-]+\.supabase\.co" ../src/tvlc/static/assets/*.js; then
            echo "::error::A Supabase project URL is compiled into the self-host build."
            echo "Self-host is standalone. Something reintroduced a credential default."
            exit 1
          fi
          echo "self-host build is clean"

      # Placeholders, not secrets, and deliberately obvious ones. Nothing
      # connects to Supabase at build time; the values only need to exist for
      # the bundle to compile, and the artifact is discarded. Real credentials
      # would buy nothing and put a key in a log.
      - name: Build cloud
        env:
          VEEDEEOH_TARGET: cloud
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: cd frontend && npm run build

      # The failure this guards against is a cloud deploy that lost its
      # environment: it would silently compile the self-host app and ship it as
      # the hosted service, with a passing build and no accounts for anyone.
      - name: A cloud build with no credentials must fail
        env:
          VEEDEEOH_TARGET: cloud
        run: |
          cd frontend
          if npm run build > /tmp/out.txt 2>&1; then
            echo "::error::A cloud build succeeded with no Supabase credentials."
            cat /tmp/out.txt
            exit 1
          fi
          grep -q "Refusing to build" /tmp/out.txt || { cat /tmp/out.txt; exit 1; }
          echo "refused, as it should"

      - name: Type check backend
        run: |
          cd backend
          npm ci
          npx tsc --noEmit

      # The production API. It had no tsconfig and was covered by nobody, so
      # billing, account deletion, the auth email hook and the crons were never
      # type checked anywhere before Vercel built them at deploy time.
      - name: Type check API
        run: |
          npm ci
          npx tsc -p api/tsconfig.check.json --noEmit

      - name: Self-host runtime and persistence regression tests
        run: npm run test:selfhost

      - name: Build the Docker image from a clean checkout
        run: docker build -t veedeeoh-selfhost:ci .

      - name: Container startup, routing and persisted library
        run: |
          docker run -d --name veedeeoh-ci -p 8321:8321 -v veedeeoh_ci:/data veedeeoh-selfhost:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8321/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8321/home > /dev/null
          curl -fsS http://localhost:8321/settings/playback > /dev/null
          curl -fsS -X POST http://localhost:8321/api/favorites -H 'Content-Type: application/json' -d '{"content_id":"test-item","title":"Saved item"}'
          docker restart veedeeoh-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8321/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8321/api/favorites | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(JSON.parse(s).favorites[0]?.content_id!=="test-item")process.exit(1)})'
          docker logs veedeeoh-ci
          docker rm -f veedeeoh-ci
          docker volume rm veedeeoh_ci
