name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Placeholders, not secrets, and deliberately obvious ones.
    #
    # vite.config.ts refuses to build without these, because the frontend used
    # to fall back to the veedeeoh.com project's own credentials and that meant
    # any build with no configuration silently pointed at our database. CI is a
    # build with no configuration, so it started failing the moment that guard
    # landed -- correctly.
    #
    # Nothing here connects to Supabase at build time. The values only need to
    # exist for the bundle to compile, and the artifact is thrown away, so real
    # credentials would buy nothing and put a key in a log for no reason. If a
    # future job actually talks to a database, it needs its own secrets and its
    # own project, never this one.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend and type check
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Type check backend
        run: |
          cd backend
          npm ci
          npx tsc --noEmit
