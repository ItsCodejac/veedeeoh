# Standalone veedeeoh: docker compose up -d --build
services:
  veedeeoh:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PROXY_URL: ${PROXY_URL:-}
    ports:
      - "${PORT:-8321}:8321"
    restart: unless-stopped
    volumes:
      # Retains the existing named volume; only its mount point changes.
      - veedeeoh_data:/data
volumes:
  veedeeoh_data:
